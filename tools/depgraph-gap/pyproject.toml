[project]
name = "depgraph-gap"
version = "0.2.0"
description = "Compare the GitHub dependency graph with Trivy for one repository."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
depgraph-gap = "depgraph_gap.cli:main"

[dependency-groups]
dev = ["pytest>=9.0"]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: runs the real gh, trivy, and cyclonedx binaries against github.com",
]
